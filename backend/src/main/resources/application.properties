spring.application.name=mealprep

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:mealprep}
spring.datasource.username=${DB_USER:mealprep}
spring.datasource.password=${DB_PASSWORD:mealprep}

spring.jpa.hibernate.ddl-auto=update

mealdb.base-url=${MEALDB_BASE_URL:https://www.themealdb.com/api/json/v1/1}
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

deepl.base-url=${DEEPL_BASE_URL:https://api-free.deepl.com}
deepl.api-key=${DEEPL_API_KEY:}